enum RatePeriod {
  HOUR
  MINUTE
  SECOND
}

"""If errors is not empty, the order wasn't changed."""
type SequenceLineupPayload {
  action: UpsertAction
  errors: [UpsertError!]!

  """The station, to read its lineup now."""
  station: Station
}

"""The site (plant) your token belongs to."""
type Site {
  description: String
  id: ID!
  name: String!

  """IANA time zone, e.g. America/Chicago."""
  timezone: String!
  updatedAt: DateTime!
}

"""A machine or work spot."""
type Station {
  archivedAt: DateTime
  createdAt: DateTime!
  currentJob: Job

  """The job it's running now."""
  currentJobId: ID
  deletedAt: DateTime
  description: String

  """
  The jobs it can run, by name: the ones you can send to its lineup. Its profile must count the same way as the station, and it must carry a label the station's job filter wants, if it has one. A run that breaks this is refused (PROFILE_MISMATCH, LABEL_FILTER_MISMATCH). At most 25 stations or jobs per request.
  """
  eligibleJobs: [Job!]!

  """
  Its ids in your own systems: the externalId you sent it with, one for each source.
  """
  externalIds: [ExternalId!]!
  id: ID!

  """
  Its lineup now: the running run, then the queued runs in order, with live counts and predicted times. Null if it has no workcenter. Worked out when asked: at most 25 stations per request.
  """
  lineup: [LineupEntry!]
  name: String!
  sortOrder: Int!
  updatedAt: DateTime!
  workcenter: Workcenter
  workcenterId: ID
}

type StationConnection {
  nodes: [Station!]!
  pageInfo: PageInfo!
}

"""
A station: one machine or work spot. Fields left out are left as they are; null clears one that can be empty. A station that follows a profile gets how it counts from the profile; only its speed can be set here.
"""
input StationInput {
  cycleMode: CycleMode
  description: String

  """
  Seconds of no cycles before it counts as down (downtimeDetect), or the share of standard speed below which it's slow (slowDetect) and above which it's fast (fastDetect). null uses its workcenter's; 0 turns it off.
  """
  downtimeDetect: Float

  """Its id in your system."""
  externalId: String!
  fastDetect: Float

  """
  Its id in IMM, to give a record made in IMM this externalId. Only needed the first time; without it a new externalId makes a new record.
  """
  id: ID

  """Needed to make a new station. Unique at the plant."""
  name: String

  """Follow this station profile. null stops following; the values stay."""
  profileId: ID
  quantityUnit: String
  slowDetect: Float
  sortOrder: Int

  """Seconds per cycle."""
  standardCycle: Float
  standardQuantity: Float
  standardRate: Float
  standardRatePeriod: RatePeriod
  standardRateUnit: String

  """Use the profile's usual speed instead of its own."""
  useProfileSpeed: Boolean

  """Which of the profile's variations."""
  variationId: ID

  """
  Its workcenter: the workcenter's externalId or IMM id. null takes it out of its workcenter.
  """
  workcenter: String
}

