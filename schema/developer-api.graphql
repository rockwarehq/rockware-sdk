  entityRecord(id: ID!): EntityRecord

  """One custom entity's records, oldest change first."""
  entityRecords(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

    """Include deleted records (they have deleted: true)."""
    includeDeleted: Boolean

    """The entity's key."""
    model: String!

    """Only records changed at or after this time."""
    updatedSince: DateTime
  ): EntityRecordConnection!
  job(id: ID!): Job

  """Job records at your site, oldest change first."""
  jobs(
    """The endCursor of the previous page."""
    after: String

    """How many (1 to 100, default 50)."""
    first: Int

