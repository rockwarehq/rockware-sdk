[project]
name = "rockware"
version = "0.1.0"
description = "The Rockware developer API for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rockware Corp." }]
keywords = ["rockware", "manufacturing", "mes", "graphql", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["graphql-core>=3.2,<4", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/rockwarehq/rockware-sdk/tree/main/python"
Source = "https://github.com/rockwarehq/rockware-sdk"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rockware"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/rockware/_generated/*" = ["E501", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests/readme_examples.py"]

# The generated methods return what _run gives back, which is Any until here.
[[tool.mypy.overrides]]
module = "rockware._generated.*"
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
