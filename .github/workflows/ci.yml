# Checks every PR and every push to main. Secret scanning runs too: this repo
# is public, so nothing private may land in it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generated code is up to date
        run: |
          pnpm generate
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated is out of date. Run pnpm generate in typescript/ and commit it."
            exit 1
          }

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Generated code is up to date
        run: |
          python scripts/generate.py
          git diff --exit-code -- src/rockware/_generated || {
            echo "::error::src/rockware/_generated is out of date. Run python scripts/generate.py in python/ and commit it."
            exit 1
          }

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generated code is up to date
        working-directory: .
        run: |
          pip install graphql-core
          python -m codegen go
          git diff --exit-code -- go || {
            echo "::error::go/ is out of date. Run python -m codegen go at the repo root and commit it."
            exit 1
          }

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generated code is up to date
        working-directory: .
        run: |
          pip install graphql-core
          python -m codegen dotnet
          git diff --exit-code -- dotnet || {
            echo "::error::dotnet/ is out of date. Run python -m codegen dotnet at the repo root and commit it."
            exit 1
          }

      - run: dotnet build src/Rockware.Sdk -c Release
      - run: dotnet test tests/Rockware.Sdk.Tests
      - run: dotnet pack src/Rockware.Sdk -c Release -o out

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose
