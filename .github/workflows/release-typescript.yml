# Publishes @rockwarehq/sdk to npm when a v<version> tag is pushed. The tag,
# VERSION and typescript/package.json must all agree.
#
# Needs the NPM_TOKEN secret: an npm automation token that can publish to the
# @rockwarehq scope.

name: Release TypeScript

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          FILE="$(cat ../VERSION)"
          PACKAGE="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$FILE" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::Tag v$TAG, VERSION $FILE and package.json $PACKAGE must match"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
