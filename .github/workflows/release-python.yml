# Publishes rockware to PyPI when a v<version> tag is pushed. Run it by hand
# (Actions → Release Python → Run workflow) to rehearse: it builds, tests and
# checks the package, and publishes nothing.
#
# No PyPI token is stored. It uses trusted publishing: PyPI trusts this
# workflow on this repo, and GitHub proves who is asking. To set it up once,
# on pypi.org: Account → Publishing → Add a pending publisher, project name
# rockware, owner rockwarehq, repo rockware-sdk, workflow release-python.yml,
# environment release-pypi. A pending publisher works before the project
# exists, so the first release needs nothing by hand.

name: Release Python

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and tests. It can't publish: it has no id-token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag matches the version
        id: version
        run: |
          FILE="$(cat ../VERSION)"
          PACKAGE="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$FILE" != "$PACKAGE" ]; then
            echo "::error::VERSION $FILE and pyproject.toml $PACKAGE must match"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF#refs/tags/v}" != "$FILE" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match VERSION $FILE"
            exit 1
          fi
          echo "version=$FILE" >> "$GITHUB_OUTPUT"

      - run: pip install -e ".[dev]" build twine
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      # skip-existing: a version already on PyPI is left alone, so the
      # workflow can be run again after a failure elsewhere.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
