# Writes. Records are found by their id in your system (externalId) and the
# name of that system (source, "erp" if you leave it out). Problems come back
# in the answer's errors list, not as a failed request: all or nothing, so if
# errors isn't empty, nothing was saved.

mutation UpsertWorkcenters($workcenters: [WorkcenterInput!]!, $source: String) {
  upsertWorkcenters(workcenters: $workcenters, source: $source) {
    results { externalId action workcenter { ...WorkcenterFields } }
    errors { ...UpsertErrorFields }
  }
}

