# Reads. Every operation asks for one root field, and the SDKs return that
# field. A list operation takes the paging arguments (first, after) and
# returns a connection, which the SDKs can page through for you.

query GetSite {
  site { ...SiteFields }
}

query GetWorkcenter($id: ID!) {
  workcenter(id: $id) { ...WorkcenterFields }
}

query ListWorkcenters($first: Int, $after: String, $updatedSince: DateTime, $includeDeleted: Boolean) {
  workcenters(first: $first, after: $after, updatedSince: $updatedSince, includeDeleted: $includeDeleted) {
    nodes { ...WorkcenterFields }
    pageInfo { hasNextPage endCursor }
  }
}

