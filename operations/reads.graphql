query GetStationLineup($id: ID!) {
  station(id: $id) {
    id
    name
    lineup {
      position
      predictedChangeoverStart
      predictedStart
      predictedEnd
      startByAtRisk
      endByAtRisk
      progress { productId requiredGood good scrap }
      run { ...ProductionRunFields }
    }
  }
}

